name: Verify
description: >-
  Checks out the repository, installs Node from .node-version, pnpm from
  packageManager and the locked dependencies, and runs pnpm verify. Run it in
  the browser test image's container (ADR 0025, in sdk-core).

inputs:
  cache:
    description: >-
      Whether to cache pnpm's store. Pull requests do; releases don't, so a
      poisoned cache can't reach a release.
    default: "true"

runs:
  using: composite
  steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .node-version

    - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      with:
        cache: ${{ inputs.cache == 'true' }}

    - shell: bash
      env:
        HUSKY: "0"
      run: pnpm install --frozen-lockfile

    - shell: bash
      run: pnpm verify
