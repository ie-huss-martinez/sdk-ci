name: action_path fixture
description: >-
  A fixture with the shape of the publish action's publishing step: a nested
  changesets/action, pinned as in publish/action.yml, whose publish-script
  runs a script next to this action through github.action_path in its with:.
  sdk-ci's CI runs it and checks that the script ran.

runs:
  using: composite
  steps:
    - uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
      env:
        ACTION_PATH_MARKER: ${{ runner.temp }}/action-path-ran.json
      with:
        cwd: test/fixtures/action-path/project
        publish-script: node ${{ github.action_path }}/script.mjs fixture-argument
        create-github-releases: false
        push-git-tags: false
