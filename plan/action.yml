name: Plan the release
description: >-
  Lists the package versions not yet on npm. A release's verify and publish
  jobs only do their work when there are some (ADR 0023, in sdk-core). Needs
  only contents read.

outputs:
  pending:
    description: Whether there are versions to publish, "true" or "false".
    value: ${{ steps.plan.outputs.pending }}

runs:
  using: composite
  steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .node-version

    # No caches: everything is installed fresh, so a poisoned cache can't
    # reach a release.
    - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

    - shell: bash
      env:
        HUSKY: "0"
      run: pnpm install --frozen-lockfile

    - id: plan
      name: Plan the release
      shell: bash
      run: "$GITHUB_ACTION_PATH/plan.sh"
