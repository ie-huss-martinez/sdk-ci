version: 2

# Updates wait 7 days after a release, so a compromised version is usually
# caught and pulled before it is proposed.
updates:
  # Keeps the commit SHAs that actions are pinned to current (ADR 0015, in
  # sdk-core): in .github/workflows, covered by `/`, and in each composite
  # action's action.yml, covered by `/*`.
  - package-ecosystem: github-actions
    directories: ["/", "/*"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
    groups:
      # One pull request per action, across every directory that uses it, so
      # all the composite actions move to the same version together.
      github-actions:
        patterns: ["*"]
        group-by: dependency-name

  # The repository's development dependencies, and check-workflows' own
  # locked yaml, which it installs when it runs.
  - package-ecosystem: npm
    directories: ["/", "/check-workflows"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    groups:
      # Minor and patch updates arrive together; each major gets its own pull
      # request, because it may need code or configuration changes.
      npm:
        patterns: ["*"]
        update-types: [minor, patch]
