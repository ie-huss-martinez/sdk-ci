name: Read the browser test image
description: >-
  Reads the browser test image from a repository's ci/Dockerfile, its only
  copy (ADR 0025, in sdk-core), and outputs it for a job's container.image.
  It requires exactly one FROM line with Microsoft's Playwright image, pinned
  by tag and digest.

inputs:
  directory:
    description: The directory of the Dockerfile.
    default: ci

outputs:
  ref:
    description: The image, pinned by tag and digest.
    value: ${{ steps.read.outputs.ref }}

runs:
  using: composite
  steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        sparse-checkout: ${{ inputs.directory }}

    # Exactly one FROM line: Microsoft's Playwright image, pinned by tag and
    # digest. Anything else fails here, before a container is pulled.
    - id: read
      name: Read the image
      shell: bash
      env:
        DOCKERFILE: ${{ inputs.directory }}/Dockerfile
      run: |
        refs=$(sed -n 's/^FROM //p' "$DOCKERFILE")
        pattern='^mcr\.microsoft\.com/playwright:v[0-9]+\.[0-9]+\.[0-9]+-noble@sha256:[0-9a-f]{64}$'
        if [ "$(printf '%s\n' "$refs" | grep -c .)" -ne 1 ] || ! printf '%s' "$refs" | grep -Eq "$pattern"; then
          echo "::error file=$DOCKERFILE::$DOCKERFILE needs exactly one FROM line: mcr.microsoft.com/playwright:<tag>-noble@sha256:<digest>."
          exit 1
        fi
        echo "ref=$refs" >> "$GITHUB_OUTPUT"
