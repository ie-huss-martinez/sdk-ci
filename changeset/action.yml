name: Check for a changeset
description: >-
  Fails a pull request that changes a published package's source or
  package.json without a changeset (ADR 0021, in sdk-core). Which files count
  is set by changedFilePatterns in the repository's .changeset/config.json.

runs:
  using: composite
  steps:
    # Full history, so that origin/main is there to compare against.
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false

    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .node-version

    - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      with:
        cache: true

    - shell: bash
      env:
        HUSKY: "0"
      run: pnpm install --frozen-lockfile

    - shell: bash
      run: pnpm changeset status --since=origin/main
